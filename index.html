<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizLab · Luyện thi IC3</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path><path d="M4 5.5v16"></path><path d="m9 10 2 2 4-4"></path></svg>
                </div>
                <div>
                    <h2>QuizLab</h2>
                    <p>Luyện thi tin học</p>
                </div>
            </div>
            <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Mở menu bài thi" aria-expanded="false" aria-controls="tree-root">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="tree-container" id="tree-root">
            <div class="tree-loading">Đang tải danh mục...</div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="quiz-header-bar">
            <div class="header-copy">
                <span class="eyebrow">BÀI KIỂM TRA</span>
                <div class="breadcrumb" id="quiz-breadcrumb">Vui lòng chọn bài thi từ menu bên trái</div>
            </div>
            <div class="header-actions">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Bật chế độ tối" aria-pressed="false" title="Bật chế độ tối">
                    <span class="theme-icon" aria-hidden="true">&#9789;</span>
                    <span class="theme-toggle-label">Chế độ tối</span>
                </button>
                <div id="quiz-status-badge" class="badge-status">Chưa nạp câu hỏi</div>
            </div>
        </header>

        <section class="content-body">
            <div id="empty-state" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <h3>Chưa chọn bài thi</h3>
                <p>Hãy chọn thư mục phía bên trái để làm bài thi.</p>
            </div>

            <form id="quiz-form" novalidate style="display: none;">
                <div id="quiz-container"></div>
                <div class="quiz-actions" id="quiz-actions">
                    <div class="actions-inner">
                        <div id="score-board">Tiến độ: 0/10 câu</div>
                        <div class="action-buttons">
                            <button type="button" class="btn btn-outline" id="reset-btn">Làm lại</button>
                            <button type="submit" class="btn" id="submit-btn">Nộp Bài</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>
</div>

<script src="js/parser.js"></script>
<script src="js/question-types.js"></script>
<script src="js/tree-manager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
