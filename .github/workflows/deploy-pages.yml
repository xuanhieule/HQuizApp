name: Deploy QuizLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate question manifest
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path.cwd()
          question_dir = root / "question"
          paths = sorted(
              path.relative_to(root).as_posix()
              for path in question_dir.rglob("*.csv")
              if path.is_file()
          )
          (root / "question-files.json").write_text(
              json.dumps(paths, ensure_ascii=False),
              encoding="utf-8"
          )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
